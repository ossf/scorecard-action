name: Postsubmits
on:
  push:
    branches: [main]
  # Keep code-scanning results current between merges.
  schedule:
    - cron: '23 7 * * 1'
  # Pre-release validation.
  workflow_dispatch:

# The Scorecard results API rejects workflows that publish results if they set
# global env vars or defaults, grant write permissions globally, or give any job
# other than the Scorecard job `id-token: write`. Keep this workflow within
# those rules: https://github.com/ossf/scorecard-action#workflow-restrictions
permissions: read-all

# One run at a time, so the Scorecard job always runs the image its own run
# pushed.
concurrency:
  group: postsubmits
  cancel-in-progress: false

jobs:
  image:
    name: Publish the latest image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  scorecard:
    name: Scorecard analysis
    needs: image
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      id-token: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs the image the previous job built from this commit, rather than
      # `ossf/scorecard-action@main`, whose action.yaml pins the last released
      # image. The reference floats on purpose: `uses:` can't take the image
      # job's digest output, and the concurrency group keeps `latest` on this
      # run's image. A docker:// step gets none of action.yaml's input
      # defaults, so they're set here.
      - name: "Run analysis"
        uses: docker://ghcr.io/ossf/scorecard-action:latest # zizmor: ignore[unpinned-images]
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ github.token }}
          file_mode: archive
          internal_publish_base_url: "https://api.scorecard.dev"
          internal_default_token: ${{ github.token }}

      # Upload the results as artifacts (optional). Commenting out will disable uploads of run results in SARIF
      # format to the repository Actions tab.
      - name: "Upload artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Upload the results to GitHub's code scanning dashboard.
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
