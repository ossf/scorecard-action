---
# The actions, and the versions, that the generated Scorecard workflows pin.
# This composite action is never run. It exists so that Dependabot keeps the
# pins current; `make generate` reads them from here and renders examples/.
name: 'Scorecard workflow template pins'
description: 'Pinned actions for the generated Scorecard workflows. Not for use.'

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
    - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
